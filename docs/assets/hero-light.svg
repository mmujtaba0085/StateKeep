<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">StateKeep: AI agent sessions that survive the real world</title>
<desc id="desc">An agent session waits for a human to approve an $80 refund. The server is killed: the session is unaffected because its state was committed. A new prompt and policy (v2) is deployed and the waiting session moves to it, keeping its place and transcript. The manager approves, the refund tool runs exactly once, and the agent replies.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  <radialGradient id="glow"><stop offset="0" stop-color="#0d9488" stop-opacity=".6"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/><rect width="1280" height="640" fill="url(#grid)" opacity=".55"/>
<g transform="translate(72,80)">
  <rect x="0" y="0" width="22" height="22" rx="6" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <rect x="30" y="18" width="22" height="22" rx="6" fill="#4f46e5"/>
  <path d="M22 11 H41 V16" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">StateKeep</text>
</g>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a" letter-spacing="-1.2"><tspan x="72" y="214">AI agents that</tspan><tspan x="72" y="272">survive the <tspan fill="#4f46e5">real world.</tspan></tspan></text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#334155"><tspan x="72" y="328">Every agent session is a durable statechart actor.</tspan><tspan x="72" y="355">Crashes don't lose it, tool calls aren't silently</tspan><tspan x="72" y="382">repeated, approvals can wait for days, and new</tspan><tspan x="72" y="409">prompts reach sessions already mid-conversation.</tspan></text>
<rect x="72" y="440" width="142" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/><text x="143" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Survives crashes</text>
<rect x="224.4" y="440" width="182" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/><text x="315" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Human approval states</text>
<rect x="72" y="484" width="285" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/><text x="214" y="506" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#334155">Tool calls never silently repeated</text>
