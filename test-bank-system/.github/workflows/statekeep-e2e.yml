name: StateKeep E2E Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Optionally provide STATEKEEP_URL as a repository secret to run against real StateKeep
      STATEKEEP_URL: ${{ secrets.STATEKEEP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: test-bank-system
      - name: Run StateKeep integration tests
        run: npm run test:statekeep
        working-directory: test-bank-system
