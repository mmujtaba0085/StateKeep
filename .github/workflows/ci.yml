name: StateKeep CI

# The previous workflow built a C mock engine from mock/libapv-mock.c and
# test/c/test_ffi_direct.c — both are in .gitignore, so those jobs could never
# pass on a clean checkout — and pointed STATEKEEP_ENGINE_PATH at it, which the
# server no longer reads (the engine ships as src/ffi/apv-engine.mjs / WASM).
# This workflow runs the same suites via the project's own runner, which starts
# and stops its own server.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  unit:
    name: "Unit, property & hot-path"
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate test keys
        run: echo "STATEKEEP_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: L1 — FFI loader & hashing
        env: { STATEKEEP_DB_PATH: /tmp/test-ffi.db }
        run: node --test test/level1/unit.ffi.js
      - name: L1 — SQLite persistence
        env: { STATEKEEP_DB_PATH: /tmp/test-db.db }
        run: node --test test/level1/unit.db.js
      - name: L4 — property-based invariants
        env: { STATEKEEP_DB_PATH: /tmp/test-prop.db }
        run: node --test test/level4/property.js
      - name: SC9 — migration routing (unit)
        env: { STATEKEEP_DB_PATH: /tmp/test-sc9.db }
        run: node --test test/statechart/sc9.unit.js
      - name: Hot path
        env: { STATEKEEP_DB_PATH: /tmp/test-hot.db }
        run: npm run -s test:hot-path

  full:
    name: "Full suite (integration, migration, chaos, statechart, legacy)"
    runs-on: ubuntu-24.04
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Run all suites (scripts/run-tests.sh starts its own server)
        run: bash scripts/run-tests.sh
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ github.run_id }}
          path: /tmp/statekeep-test-logs/

  postgres:
    name: "Full suite on Postgres"
    runs-on: ubuntu-24.04
    needs: [unit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: statekeep
          POSTGRES_PASSWORD: statekeep
          POSTGRES_DB: statekeep
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U statekeep" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STATEKEEP_DB_URL: postgresql://statekeep:statekeep@127.0.0.1:5432/statekeep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run all suites against Postgres (SQLite-internal tests skip themselves)
        run: bash scripts/run-tests.sh
      - name: Cluster mode — two servers, one Postgres (own empty database)
        run: |
          PGPASSWORD=statekeep psql -h 127.0.0.1 -U statekeep -d statekeep -c 'CREATE DATABASE statekeep_cluster'
          STATEKEEP_DB_URL=postgresql://statekeep:statekeep@127.0.0.1:5432/statekeep_cluster \
            node --test --test-timeout=60000 test/cluster/cluster.test.js

  audit:
    name: "Dependency audit"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=high
