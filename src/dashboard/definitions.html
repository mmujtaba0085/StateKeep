<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definitions — StateKeep</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css">
  <script src="/dashboard/assets/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo"><a href="/dashboard/index.html">⚙ StateKeep</a></h1>
      <nav>
        <a href="/dashboard/actors.html">Actors</a>
        <a href="/dashboard/definitions.html" class="active">Definitions</a>
        <a href="/dashboard/scheduled.html">Scheduled</a>
        <a href="/dashboard/workers.html">Workers</a>
        <a href="/dashboard/scenarios.html">Scenarios</a>
        <a href="/dashboard/metrics.html">Metrics</a>
        <a href="/dashboard/archives.html">Archives</a>
      </nav>
      <button onclick="logout()" class="btn-sm">Sign out</button>
    </div>
  </header>

  <main>
    <h2>Definitions</h2>

    <div class="card">
      <h3>Deploy New Definition</h3>
      <div class="form-col">
        <label>Definition ID <input id="def-id" placeholder="checkout-v2"></label>
        <label>Parent ID (optional) <input id="def-parent" placeholder="checkout-v1" oninput="onParentChange()"></label>
        <label>Refinement <input id="def-refinement" type="number" value="1" min="1"></label>
        <label>JSON Config
          <textarea id="def-json" rows="10" placeholder='{"initial":"idle","states":{"idle":{}}}'></textarea>
        </label>
        <div style="display:flex;gap:8px">
          <button id="deploy-btn" onclick="deployDefinition()">Deploy</button>
          <button class="btn-secondary" onclick="validateOnly()">Validate only</button>
        </div>
        <p id="deploy-result" class="message"></p>
      </div>
    </div>

    <div id="diff-panel" class="card" style="display:none">
      <h3>Diff vs parent — <span id="diff-parent-id"></span></h3>
      <div id="diff-body"></div>
    </div>

    <div id="diagram-panel" class="card" style="display:none">
      <h3>State Diagram — <span id="diagram-def-id"></span></h3>
      <div id="diagram-stats" style="margin-bottom:8px;font-size:13px;color:#555"></div>
      <div id="diagram-container"></div>
      <button style="margin-top:12px" onclick="document.getElementById('diagram-panel').style.display='none'">Close</button>
    </div>

    <h3>Deployed Definitions</h3>
    <table id="defs-table">
      <thead>
        <tr><th>ID</th><th>Parent</th><th>Status</th><th>Deployed At</th><th>Actions</th></tr>
      </thead>
      <tbody id="defs-body"></tbody>
    </table>

    <div id="deploy-status" class="card" style="display:none">
      <h3>Deployment Status — <span id="ds-def-id"></span></h3>
      <table>
        <thead><tr><th>Deployment ID</th><th>Status</th><th>Affected</th><th>Migrated</th><th>Failed</th><th>Started</th></tr></thead>
        <tbody id="ds-body"></tbody>
      </table>
      <button style="margin-top:12px" onclick="document.getElementById('deploy-status').style.display='none'">Close</button>
    </div>
  </main>

  <script>
    function logout() { sessionStorage.removeItem('sk_apikey'); window.location.href = '/dashboard/login.html'; }

    async function validateOnly() {
      let defJson;
      try { defJson = JSON.parse(document.getElementById('def-json').value); }
      catch { document.getElementById('deploy-result').textContent = 'Invalid JSON'; return; }
      const res = await apiFetch('/v1/definitions/validate', { method: 'POST', body: JSON.stringify({ definition: defJson }) });
      if (!res) return;
      const r = await res.json();
      const el = document.getElementById('deploy-result');
      if (r.valid) {
        el.style.color = '#1a5c2a';
        el.textContent = `✓ Valid — initial: "${r.initialState}", ${r.stateCount} states, finals: [${r.finalStates.join(', ')}]`;
      } else {
        el.style.color = '#c00';
        el.textContent = `✗ ${r.error}`;
      }
    }

    async function onParentChange() {
      const parentId = document.getElementById('def-parent').value.trim();
      if (!parentId) { document.getElementById('diff-panel').style.display = 'none'; return; }
    }

    async function deployDefinition() {
      const id     = document.getElementById('def-id').value.trim();
      const parent = document.getElementById('def-parent').value.trim();
      const ref    = parseInt(document.getElementById('def-refinement').value) || 1;
      let defJson;
      try { defJson = JSON.parse(document.getElementById('def-json').value); }
      catch { document.getElementById('deploy-result').textContent = 'Invalid JSON'; return; }

      const body = { id, definition: defJson, refinement: ref };
      if (parent) body.parentId = parent;

      try {
        const res = await apiFetch('/v1/definitions', { method: 'PUT', body: JSON.stringify(body) });
        if (!res) return;
        const r = await res.json();
        const el = document.getElementById('deploy-result');
        if (!res.ok) { el.style.color = '#c00'; el.textContent = `Error: ${r.error}`; return; }
        el.style.color = '#1a5c2a';
        el.textContent = r.idempotent
          ? `Already deployed (idempotent). No changes.`
          : `✓ Deployed. Affected actors: ${r.affectedActors}. Deployment: ${r.deploymentId ?? 'N/A'}`;
        loadDefinitions();
        if (parent && !r.idempotent) showDiff(id);
      } catch (e) {
        document.getElementById('deploy-result').textContent = 'Error: ' + e.message;
      }
    }

    async function showDiff(defId) {
      const res = await apiFetch(`/v1/definitions/${encodeURIComponent(defId)}/diff`);
      if (!res) return;
      const r = await res.json();
      if (!r.diff) return;
      const d = r.diff;
      let html = '';
      if (d.statesAdded.length)    html += `<p>✚ States added: <code>${d.statesAdded.join(', ')}</code></p>`;
      if (d.statesRemoved.length)  html += `<p>✖ States removed: <code>${d.statesRemoved.join(', ')}</code></p>`;
      if (d.initialChanged)        html += `<p>↺ Initial: <code>${d.initialFrom}</code> → <code>${d.initialTo}</code></p>`;
      if (d.transitionsChanged.length) {
        html += `<p>~ Transitions changed:</p><ul>`;
        for (const c of d.transitionsChanged) {
          html += `<li><code>${c.state}</code>: ${JSON.stringify(c.from)} → ${JSON.stringify(c.to)}</li>`;
        }
        html += `</ul>`;
      }
      if (!html) html = '<p style="color:#666">No structural changes detected.</p>';
      document.getElementById('diff-parent-id').textContent = r.parentId;
      document.getElementById('diff-body').innerHTML = html;
      document.getElementById('diff-panel').style.display = 'block';
    }

    async function showDeploymentStatus(defId) {
      const res = await apiFetch(`/v1/definitions/${encodeURIComponent(defId)}/status`);
      if (!res) return;
      const r = await res.json();
      document.getElementById('ds-def-id').textContent = defId;
      const tbody = document.getElementById('ds-body');
      tbody.innerHTML = '';
      for (const d of r.deployments ?? []) {
        const pct = d.affected_actors > 0
          ? Math.round(((d.migrated_count + d.failed_count) / d.affected_actors) * 100) : 100;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.id.slice(0,8)}…</td>
          <td><span class="badge badge-${d.status}">${d.status}</span></td>
          <td>${d.affected_actors}</td>
          <td>${d.migrated_count} (${pct}%)</td>
          <td>${d.failed_count}</td>
          <td>${d.started_at ? new Date(d.started_at).toLocaleString() : '—'}</td>
        `;
        tbody.appendChild(tr);
      }
      document.getElementById('deploy-status').style.display = 'block';
    }

    if (typeof mermaid !== 'undefined') mermaid.initialize({ startOnLoad: false, theme: 'default' });

    function definitionToMermaid(definition) {
      const lines  = ['stateDiagram-v2'];
      const states = definition.states ?? {};
      for (const [stateName, stateDef] of Object.entries(states)) {
        if (stateDef.type === 'final') {
          lines.push(`  ${stateName} : ${stateName} [final]`);
        }
        for (const [event, target] of Object.entries(stateDef.on ?? {})) {
          const targetName = typeof target === 'string' ? target : target?.target;
          if (targetName) lines.push(`  ${stateName} --> ${targetName} : ${event}`);
        }
      }
      lines.push(`  [*] --> ${definition.initial}`);
      return lines.join('\n');
    }

    async function showDiagram(defId) {
      const res = await apiFetch(`/v1/definitions/${encodeURIComponent(defId)}/status`);
      if (!res) return;
      const r = await res.json();
      // Fetch actor stats
      const statsRes = await apiFetch(`/v1/definitions/${encodeURIComponent(defId)}/stats`);
      let byState = {};
      if (statsRes && statsRes.ok) {
        const statsData = await statsRes.json();
        byState = statsData.byState ?? {};
        document.getElementById('diagram-stats').textContent =
          `Active actors: ${statsData.totalActive}  |  ` +
          Object.entries(byState).map(([s, n]) => `${s}: ${n}`).join(', ');
      }
      // We need the definition JSON — re-fetch via diff (has no JSON) or status (no JSON either).
      // Use validate endpoint to reconstruct from table row data.
      // Simplest: the definition list has no JSON, so load it via the deployed row in the table.
      // Pull definition JSON from the definitions table row stored in local cache.
      // Actually, we fetch it via the scenarios validate endpoint which parses it.
      // Workaround: load definition JSON from the DOM cache we built in loadDefinitions.
      const cachedDef = window._defCache?.[defId];
      if (!cachedDef) {
        document.getElementById('diagram-stats').textContent += ' (diagram unavailable — reload page)';
        document.getElementById('diagram-panel').style.display = 'block';
        document.getElementById('diagram-def-id').textContent = defId;
        return;
      }
      const mermaidStr = definitionToMermaid(cachedDef);
      const container  = document.getElementById('diagram-container');
      container.innerHTML = '';
      try {
        const { svg } = await mermaid.render('stateDiagram', mermaidStr);
        container.innerHTML = svg;
      } catch (e) {
        container.textContent = 'Diagram render failed: ' + e.message;
      }
      document.getElementById('diagram-def-id').textContent = defId;
      document.getElementById('diagram-panel').style.display = 'block';
    }

    async function loadDefinitions() {
      const tbody = document.getElementById('defs-body');
      window._defCache = window._defCache ?? {};
      try {
        const res  = await apiFetch('/v1/definitions?limit=100');
        if (!res) return;
        const data = await res.json();
        tbody.innerHTML = '';
        for (const d of data.definitions ?? []) {
          if (d.definitionJson) window._defCache[d.id] = d.definitionJson;
          const deployedAt = (() => {
            const n = Number(d.deployedAt);
            if (!Number.isFinite(n)) return '—';
            return n < 1_000_000_000_000 ? `Logical Tick #${n}` : new Date(n).toLocaleString();
          })();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code>${d.id}</code></td>
            <td><code>${d.parentId ?? '—'}</code></td>
            <td><span class="badge badge-${d.status}">${d.status}</span></td>
            <td>${deployedAt}</td>
            <td>
              <button onclick="showDeploymentStatus('${d.id}')">Status</button>
              ${d.parentId ? `<button class="btn-secondary" onclick="showDiff('${d.id}')">Diff</button>` : ''}
              <button class="btn-secondary" onclick="showDiagram('${d.id}')">Diagram</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="error">${e.message}</td></tr>`;
      }
    }

    loadDefinitions();
  </script>
</body>
</html>
