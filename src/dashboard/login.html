<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StateKeep — Sign In</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f0; }
    .login-card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 40px; width: 340px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .login-card h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .login-card p { color: #666; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; box-sizing: border-box; padding: 9px 12px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
      margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #555; }
    button { width: 100%; padding: 10px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    button:hover { background: #333; }
    .error { color: #c00; font-size: 13px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>StateKeep</h1>
    <p>Enter your API key to access the dashboard.</p>
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk_..." autocomplete="current-password">
    <button onclick="login()">Sign In</button>
    <div class="error" id="error">Invalid API key. Please try again.</div>
  </div>
  <script>
    async function login() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return;
      try {
        const res = await fetch('/v1/auth/verify', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ apiKey: key }),
        });
        if (res.ok) {
          sessionStorage.setItem('sk_apikey', key);
          window.location.href = '/dashboard/index.html';
        } else {
          document.getElementById('error').style.display = 'block';
        }
      } catch {
        document.getElementById('error').style.display = 'block';
      }
    }
    document.getElementById('apiKey').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
