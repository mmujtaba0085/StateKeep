<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives — StateKeep</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo"><a href="/dashboard/">⚙ StateKeep</a></h1>
      <nav>
        <a href="/dashboard/actors.html">Actors</a>
        <a href="/dashboard/definitions.html">Definitions</a>
        <a href="/dashboard/scheduled.html">Scheduled</a>
        <a href="/dashboard/workers.html">Workers</a>
        <a href="/dashboard/scenarios.html">Scenarios</a>
        <a href="/dashboard/metrics.html">Metrics</a>
        <a href="/dashboard/archives.html" class="active">Archives</a>
      </nav>
      <div id="key-status" class="key-status" style="cursor:pointer" onclick="signOut()">Sign out</div>
    </div>
  </header>

  <main>
    <h2>Archived Actors</h2>

    <div id="status-banner" class="status-banner" style="display:none"></div>

    <div class="toolbar">
      <input id="filter-machine" type="text" placeholder="Filter by machine ID..."
             oninput="loadArchives()" style="flex:1">
      <button onclick="loadArchives()">Refresh</button>
    </div>

    <div id="archives-table-wrap">
      <table id="archives-table">
        <thead>
          <tr>
            <th>Actor ID</th>
            <th>Machine ID</th>
            <th>Definition</th>
            <th>State at Archive</th>
            <th>Archived At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="archives-body"></tbody>
      </table>
    </div>

    <div id="pager" style="margin-top:12px;font-size:13px"></div>
  </main>

  <script src="/dashboard/assets/app.js"></script>
  <script>
    const PAGE_SIZE = 50;
    let currentOffset = 0;
    let totalCount    = 0;
    let pollTimer     = null;

    function signOut() {
      sessionStorage.removeItem('sk_apikey');
      window.location.href = '/dashboard/login.html';
    }

    function showBanner(msg, ok = true) {
      const el = document.getElementById('status-banner');
      el.textContent = msg;
      el.style.display = 'block';
      el.style.background = ok ? '#d4edda' : '#f8d7da';
      el.style.color      = ok ? '#155724' : '#721c24';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    function archiveRowHtml(a) {
      const sv = a.stateValue != null
        ? (typeof a.stateValue === 'string' ? a.stateValue : JSON.stringify(a.stateValue))
        : '—';
      const at = a.archivedAt ? new Date(a.archivedAt).toLocaleString() : '—';
      const shortId = a.actorId ? a.actorId.slice(0, 8) + '…' : '—';
      return `
        <td><code title="${a.actorId}">${shortId}</code></td>
        <td><code>${a.machineId ?? '—'}</code></td>
        <td>${a.definitionId ?? '—'}</td>
        <td><code>${sv}</code></td>
        <td>${at}</td>
        <td>
          <button onclick="restoreActor('${a.actorId}')">Restore</button>
        </td>
      `;
    }

    async function loadArchives(offset = 0) {
      currentOffset = offset;
      const machineId = document.getElementById('filter-machine').value.trim();
      let url = `/v1/archives?limit=${PAGE_SIZE}&offset=${offset}`;
      if (machineId) url += `&machineId=${encodeURIComponent(machineId)}`;

      const tbody = document.getElementById('archives-body');
      const res   = await apiFetch(url);
      if (!res) return;

      const data     = await res.json();
      const archives = data.archives ?? [];
      totalCount     = data.count ?? archives.length;

      if (!archives.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No archived actors yet</td></tr>';
        renderPager();
        return;
      }

      tbody.innerHTML = '';
      for (const a of archives) {
        const tr = document.createElement('tr');
        tr.dataset.actorId = a.actorId;
        tr.innerHTML = archiveRowHtml(a);
        tbody.appendChild(tr);
      }

      renderPager();
    }

    function renderPager() {
      const pager = document.getElementById('pager');
      pager.innerHTML = '';

      if (currentOffset > 0) {
        const prev = document.createElement('button');
        prev.textContent = '← Previous';
        prev.className   = 'btn-sm';
        prev.onclick     = () => loadArchives(currentOffset - PAGE_SIZE);
        pager.appendChild(prev);
        pager.appendChild(document.createTextNode(' '));
      }

      const end = currentOffset + PAGE_SIZE;
      if (totalCount > end) {
        const next = document.createElement('button');
        next.textContent = 'Next →';
        next.className   = 'btn-sm';
        next.onclick     = () => loadArchives(currentOffset + PAGE_SIZE);
        pager.appendChild(next);
      }

      if (totalCount > 0) {
        const from = currentOffset + 1;
        const to   = Math.min(currentOffset + PAGE_SIZE, totalCount);
        pager.appendChild(document.createTextNode(` Showing ${from}–${to} of ${totalCount}`));
      }
    }

    async function restoreActor(actorId) {
      if (!confirm(`Restore actor ${actorId}?`)) return;
      const res = await apiFetch(`/v1/actors/${actorId}/restore`, { method: 'POST', body: '{}' });
      if (!res) return;
      if (res.ok || res.status === 201) {
        showBanner(`Actor ${actorId.slice(0, 8)}… restored successfully.`);
        loadArchives(currentOffset);
      } else {
        const d = await res.json().catch(() => ({}));
        showBanner(`Restore failed: ${d.error ?? res.status}`, false);
      }
    }

    loadArchives();
    // Archives change slowly — 10s poll is sufficient
    pollTimer = setInterval(() => loadArchives(currentOffset), 10_000);
  </script>
</body>
</html>
