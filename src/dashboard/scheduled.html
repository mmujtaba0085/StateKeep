<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Events — StateKeep</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo"><a href="/dashboard/">⚙ StateKeep</a></h1>
      <nav>
        <a href="/dashboard/actors.html">Actors</a>
        <a href="/dashboard/definitions.html">Definitions</a>
        <a href="/dashboard/scheduled.html" class="active">Scheduled</a>
        <a href="/dashboard/workers.html">Workers</a>
        <a href="/dashboard/scenarios.html">Scenarios</a>
        <a href="/dashboard/metrics.html">Metrics</a>
        <a href="/dashboard/archives.html">Archives</a>
      </nav>
      <div id="key-status" class="key-status" style="cursor:pointer" onclick="signOut()">Sign out</div>
    </div>
  </header>

  <main>
    <h2>Scheduled Events</h2>

    <div class="toolbar">
      <button class="tab-btn active" onclick="setTab('pending')">Pending</button>
      <button class="tab-btn" onclick="setTab('fired')">Fired</button>
      <button class="tab-btn" onclick="setTab('failed')">Failed</button>
      <button class="tab-btn" onclick="setTab('all')">All</button>
      <button onclick="loadEvents()">Refresh</button>
      <span id="poll-label" style="margin-left:8px;color:#888;font-size:.85em">Auto-refresh every 5s</span>
    </div>

    <div id="events-table-wrap">
      <table id="events-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Actor ID</th>
            <th>Event Type</th>
            <th>Fire At</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="events-tbody">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const KEY = sessionStorage.getItem('sk_api_key') || '';
    if (!KEY) { location.href = '/dashboard/login.html'; }

    let currentTab = 'pending';
    let pollTimer  = null;

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-btn')[['pending','fired','failed','all'].indexOf(tab)].classList.add('active');
      loadEvents();
    }

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json', 'x-api-key': KEY } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      return { status: res.status, body: res.ok ? await res.json() : null };
    }

    async function loadEvents() {
      try {
        // Collect all scheduled events by fetching per-actor list from admin endpoint
        const res = await fetch(`/v1/scheduled?limit=200`, {
          headers: { 'x-admin-key': sessionStorage.getItem('sk_admin_key') || '' }
        });

        if (!res.ok) {
          // Fall back: no admin key, show message
          document.getElementById('events-tbody').innerHTML =
            '<tr><td colspan="6" class="empty">Admin key required to list all events. Use actor page to view per-actor schedules.</td></tr>';
          return;
        }

        const data  = await res.json();
        const rows  = (data.scheduledEvents || []).filter(e =>
          currentTab === 'all' ? true : e.status === currentTab
        );

        const tbody = document.getElementById('events-tbody');
        if (!rows.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty">No ${currentTab} events.</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map(e => `
          <tr>
            <td>${e.id}</td>
            <td title="${e.actor_id}">${e.actor_id.slice(0, 8)}…</td>
            <td>${e.event_type}</td>
            <td>${new Date(e.fire_at).toLocaleString()}</td>
            <td><span class="badge badge-${e.status}">${e.status}</span></td>
            <td>${e.status === 'pending'
              ? `<button onclick="cancelEvent('${e.actor_id}','${e.id}')">Cancel</button>`
              : '—'}</td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('events-tbody').innerHTML =
          `<tr><td colspan="6" class="empty">Error: ${err.message}</td></tr>`;
      }
    }

    async function cancelEvent(actorId, schedId) {
      if (!confirm(`Cancel scheduled event ${schedId}?`)) return;
      const res = await api('DELETE', `/v1/actors/${actorId}/schedule/${schedId}`);
      if (res.status === 200) loadEvents();
      else alert(`Failed to cancel event (${res.status})`);
    }

    function signOut() {
      sessionStorage.removeItem('sk_api_key');
      location.href = '/dashboard/login.html';
    }

    // Initial load + polling
    loadEvents();
    pollTimer = setInterval(loadEvents, 5000);
  </script>

  <style>
    .tab-btn { margin-right: 4px; }
    .tab-btn.active { font-weight: bold; border-bottom: 2px solid var(--accent, #4a90e2); }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: .8em; }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-fired    { background: #d1e7dd; color: #0a3622; }
    .badge-failed   { background: #f8d7da; color: #58151c; }
    .badge-cancelled { background: #e2e3e5; color: #383d41; }
  </style>
</body>
</html>
