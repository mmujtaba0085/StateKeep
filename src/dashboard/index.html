<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StateKeep Dashboard</title>
  <link rel="stylesheet" href="/dashboard/assets/style.css">
  <script src="/dashboard/assets/app.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo">⚙ StateKeep</h1>
      <nav>
        <a href="/dashboard/actors.html">Actors</a>
        <a href="/dashboard/definitions.html">Definitions</a>
        <a href="/dashboard/scheduled.html">Scheduled</a>
        <a href="/dashboard/workers.html">Workers</a>
        <a href="/dashboard/scenarios.html">Scenarios</a>
        <a href="/dashboard/metrics.html">Metrics</a>
      </nav>
      <button onclick="logout()" class="btn-sm">Sign out</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2>StateKeep Platform</h2>
      <p>Hosted XState v5 state machines with zero-downtime version migration.</p>

      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-active">—</div>
          <div class="stat-label">Active Actors</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-migrating">—</div>
          <div class="stat-label">Migrating</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-definitions">—</div>
          <div class="stat-label">Definitions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-engine">—</div>
          <div class="stat-label">Engine Mode</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function logout() {
      sessionStorage.removeItem('sk_apikey');
      window.location.href = '/dashboard/login.html';
    }

    async function loadStats() {
      try {
        const hres = await apiFetch('/v1/health');
        if (!hres) return;
        const h = await hres.json();
        document.getElementById('stat-engine').textContent = h.engine;

        const mres = await apiFetch('/v1/metrics');
        if (!mres) return;
        const rawText = await mres.text();
        const m = {};
        for (const line of rawText.split('\n')) {
          if (line.startsWith('#') || !line.trim()) continue;
          const parts = line.trim().split(/\s+/);
          if (parts.length >= 2) m[parts[0]] = parseFloat(parts[1]);
        }
        document.getElementById('stat-active').textContent      = m['statekeep_actors_active']     ?? '—';
        document.getElementById('stat-migrating').textContent   = m['statekeep_actors_migrating']  ?? '—';
        document.getElementById('stat-definitions').textContent = m['statekeep_definitions_total'] ?? '—';
      } catch {}
    }

    loadStats();
    setInterval(loadStats, 30_000);
  </script>
</body>
</html>
